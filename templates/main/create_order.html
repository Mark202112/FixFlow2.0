{% extends 'base.html' %}
{% block content %}
<div style="max-width:560px;margin:60px auto;padding:0 24px;">
    <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:16px;padding:40px;box-shadow:0 4px 24px rgba(0,0,0,0.06);">

        <div style="display:flex;align-items:center;gap:12px;margin-bottom:28px;">
            <div style="width:48px;height:48px;border-radius:12px;background:rgba(0,122,255,.1);border:1px solid rgba(0,122,255,.25);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                <i class="fas fa-tools" style="color:#007AFF;font-size:1.2rem;"></i>
            </div>
            <div>
                <h2 style="color:#1A202C;font-size:1.4rem;font-weight:700;margin:0;line-height:1.2;">Залишити заявку</h2>
                <p style="color:#6b7280;font-size:.82rem;margin:4px 0 0;">Ми зв'яжемося протягом 5 хвилин</p>
            </div>
        </div>

        <form method="post">
            {% csrf_token %}

            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#007AFF;margin-bottom:8px;">Ваше ім'я *</label>
                <input type="text" name="name" required placeholder="Іван Петренко"
                       style="width:100%;padding:12px 16px;background:#F7FAFC;border:1px solid #E2E8F0;border-radius:10px;color:#1A202C;font-size:.875rem;outline:none;box-sizing:border-box;transition:border-color .2s,box-shadow .2s;"
                       onfocus="this.style.borderColor='rgba(0,122,255,.55)';this.style.boxShadow='0 0 0 3px rgba(0,122,255,.08)'"
                       onblur="this.style.borderColor='#E2E8F0';this.style.boxShadow='none'">
            </div>

            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#007AFF;margin-bottom:8px;">Телефон *</label>
                <input type="tel" name="phone" required placeholder="0501234567"
                       style="width:100%;padding:12px 16px;background:#F7FAFC;border:1px solid #E2E8F0;border-radius:10px;color:#1A202C;font-size:.875rem;outline:none;box-sizing:border-box;transition:border-color .2s,box-shadow .2s;"
                       onfocus="this.style.borderColor='rgba(0,122,255,.55)';this.style.boxShadow='0 0 0 3px rgba(0,122,255,.08)'"
                       onblur="this.style.borderColor='#E2E8F0';this.style.boxShadow='none'">
            </div>

            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#007AFF;margin-bottom:8px;">Email <span style="color:#9ca3af;font-weight:400;text-transform:none;letter-spacing:0;">(необов'язково)</span></label>
                <input type="email" name="email" placeholder="email@example.com"
                       style="width:100%;padding:12px 16px;background:#F7FAFC;border:1px solid #E2E8F0;border-radius:10px;color:#1A202C;font-size:.875rem;outline:none;box-sizing:border-box;transition:border-color .2s,box-shadow .2s;"
                       onfocus="this.style.borderColor='rgba(0,122,255,.55)';this.style.boxShadow='0 0 0 3px rgba(0,122,255,.08)'"
                       onblur="this.style.borderColor='#E2E8F0';this.style.boxShadow='none'">
            </div>

            <div style="margin-bottom:16px;">
                <label style="display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#007AFF;margin-bottom:8px;">Пристрій *</label>
                <input type="text" name="device" required placeholder="iPhone 15 Pro, Samsung S24..."
                       style="width:100%;padding:12px 16px;background:#F7FAFC;border:1px solid #E2E8F0;border-radius:10px;color:#1A202C;font-size:.875rem;outline:none;box-sizing:border-box;transition:border-color .2s,box-shadow .2s;"
                       onfocus="this.style.borderColor='rgba(0,122,255,.55)';this.style.boxShadow='0 0 0 3px rgba(0,122,255,.08)'"
                       onblur="this.style.borderColor='#E2E8F0';this.style.boxShadow='none'">
            </div>

            <div style="margin-bottom:24px;">
                <label style="display:block;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#007AFF;margin-bottom:8px;">Опис проблеми *</label>
                <textarea name="problem" required rows="4" placeholder="Не вмикається, розбитий екран..."
                          style="width:100%;padding:12px 16px;background:#F7FAFC;border:1px solid #E2E8F0;border-radius:10px;color:#1A202C;font-size:.875rem;outline:none;box-sizing:border-box;resize:vertical;transition:border-color .2s,box-shadow .2s;font-family:inherit;"
                          onfocus="this.style.borderColor='rgba(0,122,255,.55)';this.style.boxShadow='0 0 0 3px rgba(0,122,255,.08)'"
                          onblur="this.style.borderColor='#E2E8F0';this.style.boxShadow='none'"></textarea>
            </div>

            <button type="submit" class="btn-primary" style="width:100%;justify-content:center;padding:14px;">
                <i class="fas fa-paper-plane" style="margin-right:8px;font-size:.8rem;"></i>
                Відправити заявку
            </button>
        </form>
    </div>
</div>
{% endblock %}
