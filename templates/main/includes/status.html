<!-- ═══════════════════════════ STATUS ═══════════════════════════ -->
<section id="status" class="relative overflow-hidden"
         style="background-color:#1A1A1B;
                background-image:radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1px);
                background-size:30px 30px;
                padding:100px 0;">
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-1/2 divider-line"></div>

    <div class="max-w-7xl mx-auto px-6 relative z-10">

        <div class="reveal-on-scroll text-center mb-16">
            <span class="block text-[10px] font-bold uppercase tracking-[0.3em] mb-4" style="color:#007AFF;">Відстеження</span>
            <h2 class="text-4xl md:text-5xl font-bold text-white tracking-tight mb-4">Статус замовлення</h2>
            <p class="text-gray-400 text-lg max-w-2xl mx-auto">Введіть номер телефону або номер замовлення</p>
        </div>

        <div class="reveal-on-scroll max-w-2xl mx-auto">
            <form id="status-form"
                  style="background:rgba(26,26,27,0.85); border:1px solid rgba(0,122,255,0.25);
                         padding:40px; border-radius:14px; backdrop-filter:blur(8px);">

                <div class="flex flex-col sm:flex-row gap-3">
                    <div class="relative flex-1">
                        <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-sm" style="color:#007AFF;"></i>
                        <input type="text" name="search" id="status-input"
                               placeholder="Номер замовлення або телефон"
                               required
                               style="width:100%;padding:14px 16px 14px 44px;background:rgba(42,42,45,0.5);
                                      border:1px solid rgba(0,122,255,0.2);border-radius:10px;
                                      color:#fff;font-size:0.9rem;outline:none;transition:border-color .2s;box-sizing:border-box;"
                               onfocus="this.style.borderColor='rgba(0,122,255,0.7)'"
                               onblur="this.style.borderColor='rgba(0,122,255,0.2)'">
                    </div>
                    <button type="submit" id="status-btn" class="btn-primary" style="white-space:nowrap;padding:14px 28px;">
                        Знайти
                    </button>
                </div>

                <!-- Hints -->
                <div style="display:flex; flex-wrap:wrap; gap:16px; margin-top:12px;">
                    <span style="font-size:.72rem; color:#4b5563;">
                        <i class="fas fa-circle-info" style="color:#007AFF; margin-right:5px; font-size:.65rem;"></i>
                        Приклад по номеру: <span style="color:#6b7280; font-family:monospace;">RM12345678</span>
                    </span>
                    <span style="font-size:.72rem; color:#4b5563;">
                        <i class="fas fa-circle-info" style="color:#007AFF; margin-right:5px; font-size:.65rem;"></i>
                        Приклад по телефону: <span style="color:#6b7280; font-family:monospace;">0501234567</span>
                    </span>
                </div>

                <!-- Results container (filled by JS) -->
                <div id="status-results"></div>

            </form>
        </div>

    </div>

    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1/2 divider-line"></div>
</section>

<style>
.status-badge {
    display: inline-block;
    padding: 5px 14px;
    font-size: .72rem;
    font-weight: 600;
    border-radius: 6px;
    white-space: nowrap;
}
.badge-new       { background: rgba(0,122,255,.15);    color: #007AFF;  border: 1px solid rgba(0,122,255,.3); }
.badge-progress  { background: rgba(255,149,0,.12);    color: #ff9500;  border: 1px solid rgba(255,149,0,.3); }
.badge-ready     { background: rgba(52,199,89,.12);    color: #34c759;  border: 1px solid rgba(52,199,89,.3); }
.badge-completed { background: rgba(134,134,139,.12);  color: #86868b;  border: 1px solid rgba(134,134,139,.3); }
.badge-cancelled { background: rgba(255,59,48,.12);    color: #ff3b30;  border: 1px solid rgba(255,59,48,.3); }

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}
.result-item {
    animation: fadeInUp 0.4s ease-out;
}
</style>

<script>
document.getElementById('status-form').addEventListener('submit', function(e){
    e.preventDefault();
    
    var searchInput = document.getElementById('status-input');
    var searchBtn   = document.getElementById('status-btn');
    var resultsBox  = document.getElementById('status-results');
    var query       = searchInput.value.trim();

    if (!query) return;

    // Show loading state
    searchBtn.disabled = true;
    searchBtn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i>Шукаємо...';
    resultsBox.innerHTML = '';

    // Fetch results
    fetch('{% url "main:check_status_api" %}', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded',
            'X-CSRFToken': getCookie('csrftoken')
        },
        body: 'search=' + encodeURIComponent(query)
    })
    .then(function(response){ return response.json(); })
    .then(function(data){
        // Reset button
        searchBtn.disabled = false;
        searchBtn.innerHTML = 'Знайти';

        if (data.orders && data.orders.length > 0) {
            // Show results
            var html = '<div style="border-top:1px solid rgba(0,122,255,0.15);margin-top:24px;padding-top:24px;display:flex;flex-direction:column;gap:16px;">';
            
            data.orders.forEach(function(order, index){
                var badgeClass = 'badge-new';
                if (order.status === 'in_progress') badgeClass = 'badge-progress';
                else if (order.status === 'ready') badgeClass = 'badge-ready';
                else if (order.status === 'completed') badgeClass = 'badge-completed';
                else if (order.status === 'cancelled') badgeClass = 'badge-cancelled';

                html += '<div class="result-item" style="padding:20px;background:rgba(42,42,45,0.25);border:1px solid rgba(0,122,255,0.2);border-radius:10px;animation-delay:' + (index * 0.1) + 's;">';
                
                // Header
                html += '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;">';
                html += '<div>';
                html += '<p style="font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.15em;color:#007AFF;margin-bottom:6px;">' + order.order_number + '</p>';
                html += '<p style="color:#fff;font-size:1rem;font-weight:600;margin-bottom:4px;">' + order.device + '</p>';
                html += '<p style="color:#6b7280;font-size:.8rem;">Створено: ' + order.created + '</p>';
                html += '</div>';
                html += '<div><span class="status-badge ' + badgeClass + '">' + order.status_display + '</span></div>';
                html += '</div>';

                // Comments
                if (order.comments && order.comments.length > 0) {
                    html += '<div style="border-top:1px solid rgba(0,122,255,0.1);padding-top:16px;margin-top:12px;">';
                    html += '<p style="font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#007AFF;margin-bottom:12px;">Коментарі майстра:</p>';
                    html += '<div style="display:flex;flex-direction:column;gap:10px;">';
                    
                    order.comments.forEach(function(comment){
                        html += '<div style="padding:12px;background:rgba(42,42,45,0.4);border:1px solid rgba(0,122,255,0.08);border-radius:8px;border-left:3px solid #007AFF;">';
                        html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">';
                        html += '<span style="font-size:.75rem;font-weight:600;color:#007AFF;">' + comment.author + '</span>';
                        html += '<span style="font-size:.7rem;color:#4b5563;">' + comment.date + '</span>';
                        html += '</div>';
                        html += '<p style="color:#9ca3af;font-size:.85rem;line-height:1.6;margin:0;">' + comment.text + '</p>';
                        html += '</div>';
                    });
                    
                    html += '</div></div>';
                }

                html += '</div>';
            });

            html += '</div>';
            resultsBox.innerHTML = html;

        } else {
            // No results
            resultsBox.innerHTML = '<div style="border-top:1px solid rgba(0,122,255,0.15);margin-top:24px;padding-top:24px;">' +
                '<div style="padding:16px;background:rgba(255,149,0,.08);border:1px solid rgba(255,149,0,.25);border-radius:10px;display:flex;align-items:center;gap:12px;animation:fadeInUp 0.4s ease-out;">' +
                '<i class="fas fa-exclamation-circle" style="color:#ff9500;font-size:1.1rem;flex-shrink:0;"></i>' +
                '<div><p style="color:#ff9500;font-size:.875rem;font-weight:600;margin-bottom:2px;">Замовлення не знайдено</p>' +
                '<p style="color:#9ca3af;font-size:.8rem;">Перевірте правильність введеного номера</p></div>' +
                '</div></div>';
        }
    })
    .catch(function(err){
        searchBtn.disabled = false;
        searchBtn.innerHTML = 'Знайти';
        resultsBox.innerHTML = '<div style="border-top:1px solid rgba(0,122,255,0.15);margin-top:24px;padding-top:24px;">' +
            '<div style="padding:16px;background:rgba(255,59,48,.08);border:1px solid rgba(255,59,48,.25);border-radius:10px;display:flex;align-items:center;gap:12px;">' +
            '<i class="fas fa-times-circle" style="color:#ff3b30;font-size:1.1rem;flex-shrink:0;"></i>' +
            '<div><p style="color:#ff3b30;font-size:.875rem;font-weight:600;">Помилка пошуку</p></div>' +
            '</div></div>';
    });
});

function getCookie(name) {
    var value = '; ' + document.cookie;
    var parts = value.split('; ' + name + '=');
    if (parts.length === 2) return parts.pop().split(';').shift();
}
</script>
