<section id="contact" class="relative overflow-hidden" style="background-color:#1A1A1B; background-image:radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1px); background-size:30px 30px; padding:100px 0;">

            <h2 class="text-4xl md:text-5xl font-bold text-white tracking-tight mb-4">Зв'яжіться з нами</h2>

        <!-- Contact info grid (centered, no form) -->
        <div class="reveal-on-scroll max-w-4xl mx-auto">

                <!-- Phone -->

                     style="background-color:#1A1A1B; background-image:radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1px); background-size:30px 30px; border:1px solid rgba(0,122,255,0.18); border-radius:12px;">
                    <div class="w-14 h-14 flex items-center justify-center mx-auto mb-4"
                         style="background:rgba(42,42,45,0.6); border:1px solid rgba(0,122,255,0.3); border-radius:10px;">
                        <i class="fas fa-phone" style="color:#007AFF; font-size:1.2rem;"></i>
                    </div>
                    <h4 class="text-[9px] font-bold uppercase tracking-[0.2em] mb-3" style="color:#007AFF;">Телефон</h4>
                    <a href="tel:+380501234567" class="block text-white text-sm mb-1 hover:text-brand transition-colors">+380 50 123 45 67</a>
                    <a href="tel:+380671234567" class="block text-white text-sm hover:text-brand transition-colors">+380 67 123 45 67</a>
                </div>

                <!-- Address -->
                <div class="group p-6 text-center transition-all duration-300 hover:-translate-y-1"
                     style="background-color:#1A1A1B; background-image:radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1px); background-size:30px 30px; border:1px solid rgba(0,122,255,0.18); border-radius:12px;">

                    <h4 class="text-[9px] font-bold uppercase tracking-[0.2em] mb-3" style="color:#007AFF;">Адреса</h4>

                <!-- Email -->
                <div class="group p-6 text-center transition-all duration-300 hover:-translate-y-1"
                     style="background-color:#1A1A1B; background-image:radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1px); background-size:30px 30px; border:1px solid rgba(0,122,255,0.18); border-radius:12px;">

                    </div>
                    <h4 class="text-[9px] font-bold uppercase tracking-[0.2em] mb-3" style="color:#007AFF;">Email</h4>
                    <a href="mailto:info@fixflow.ua" class="block text-white text-sm mb-1 hover:text-brand transition-colors">info@fixflow.ua</a>
                    <a href="mailto:support@fixflow.ua" class="block text-white text-sm hover:text-brand transition-colors">support@fixflow.ua</a>
                </div>

                </div>

            </div>

                <div class="flex justify-center gap-4 flex-wrap">

    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1/2 divider-line"></div>
