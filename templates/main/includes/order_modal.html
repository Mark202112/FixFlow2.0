<!-- ═══════════════════════════ ORDER MODAL ═══════════════════════════ -->
<style>
#orderModal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; z-index:9999; }
#ordOverlay {
    position:absolute; top:0; left:0; width:100%; height:100%;
    background:rgba(0,0,0,0); backdrop-filter:blur(0px);
    transition:background .32s cubic-bezier(.16,1,.3,1), backdrop-filter .32s cubic-bezier(.16,1,.3,1);
}
#ordContainer {
    pointer-events:auto; width:100%; max-width:520px; max-height:90vh; overflow-y:auto;
    background:#1A1A1B; border:1px solid rgba(0,122,255,.35); border-radius:16px;
    box-shadow:0 24px 80px rgba(0,0,0,.8), 0 0 0 1px rgba(255,255,255,.05);
    opacity:0; transform:scale(.94) translateY(16px);
    transition:opacity .32s cubic-bezier(.16,1,.3,1), transform .32s cubic-bezier(.16,1,.3,1);
    scrollbar-width:thin; scrollbar-color:rgba(0,122,255,.3) transparent;
}
#ordContainer::-webkit-scrollbar{width:4px;}
#ordContainer::-webkit-scrollbar-track{background:transparent;}
#ordContainer::-webkit-scrollbar-thumb{background:rgba(0,122,255,.3);border-radius:2px;}
.ord-input {
    width:100%; padding:12px 16px; background:rgba(42,42,45,.6);
    border:1px solid rgba(255,255,255,0.08); border-radius:10px;
    color:#fff; font-size:.875rem; outline:none; box-sizing:border-box;
    transition:border-color .2s, box-shadow .2s; font-family:inherit;
}
.ord-input::placeholder { color:#4b5563; }
.ord-input:focus { border-color:rgba(0,122,255,0.65); box-shadow:0 0 0 3px rgba(0,122,255,0.1); }

/* Success animations */
@keyframes successScaleIn { from { transform:scale(0); } to { transform:scale(1); } }
@keyframes successCheckPop { from { transform:translate(-50%,-50%) scale(0); } to { transform:translate(-50%,-50%) scale(1); } }
@keyframes successFadeUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes successPulse {
    0%, 100% { box-shadow:0 0 0 0 rgba(52,199,89,.5); }
    50% { box-shadow:0 0 0 15px rgba(52,199,89,0); }
}
</style>

<div id="orderModal">
    <div id="ordOverlay" onclick="closeOrderModal()" style="display:flex;align-items:center;justify-content:center;padding:20px;">
        <div id="ordContainer" onclick="event.stopPropagation();">

            <!-- FORM STATE -->
            <div id="ord-form-state">
                <!-- Header -->
                <div style="padding:28px 28px 20px; border-bottom:1px solid rgba(255,255,255,.06); position:relative;">
                    <button onclick="closeOrderModal()" style="position:absolute; top:24px; right:24px; width:32px; height:32px; border-radius:8px; border:1px solid rgba(255,255,255,.08); background:rgba(42,42,45,.6); color:#fff; cursor:pointer; transition:transform .2s, border-color .2s;" onmouseover="this.style.transform='rotate(90deg)'; this.style.borderColor='rgba(0,122,255,.5)';" onmouseout="this.style.transform='rotate(0deg)'; this.style.borderColor='rgba(255,255,255,.08)';">
                        <i class="fas fa-times" style="font-size:.9rem;"></i>
                    </button>
                    <div style="display:flex; align-items:center; gap:12px; margin-bottom:8px;">
                        <div style="width:48px; height:48px; border-radius:12px; background:rgba(0,122,255,.15); border:1px solid rgba(0,122,255,.3); display:flex; align-items:center; justify-content:center;">
                            <i class="fas fa-tools" style="color:#007AFF; font-size:1.3rem;"></i>
                        </div>
                        <div>
                            <h3 style="color:#fff; font-size:1.4rem; font-weight:700; margin:0; line-height:1.2;">Залишити заявку</h3>
                            <p style="color:#6b7280; font-size:.82rem; margin:4px 0 0;">Ми зв'яжемось протягом 5 хвилин</p>
                        </div>
                    </div>
                </div>

                <!-- Form -->
                <form id="ord-form" method="POST" action="{% url 'main:create_order' %}">
                    {% csrf_token %}
                    <div style="padding:24px 28px;">
                        <div style="margin-bottom:18px;">
                            <label style="display:block; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:#007AFF; margin-bottom:8px;">Ваше ім'я *</label>
                            <input type="text" name="name" required placeholder="Іван Петренко" class="ord-input">
                        </div>
                        <div style="margin-bottom:18px;">
                            <label style="display:block; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:#007AFF; margin-bottom:8px;">Телефон *</label>
                            <input type="tel" name="phone" required placeholder="0501234567" class="ord-input">
                        </div>
                        <div style="margin-bottom:18px;">
                            <label style="display:block; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:#007AFF; margin-bottom:8px;">Пристрій *</label>
                            <input type="text" name="device" required placeholder="iPhone 15 Pro, Samsung S24..." class="ord-input">
                        </div>
                        <div style="margin-bottom:18px;">
                            <label style="display:block; font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:#007AFF; margin-bottom:8px;">Опис проблеми *</label>
                            <textarea name="problem" required rows="3" placeholder="Не вмикається, розбитий екран, не заряджається..." class="ord-input" style="resize:vertical;"></textarea>
                        </div>
                    </div>

                    <!-- Footer -->
                    <div style="padding:20px 28px; border-top:1px solid rgba(255,255,255,.06); display:flex; gap:12px;">
                        <button type="button" onclick="closeOrderModal()" class="btn-outline" style="flex:1; justify-content:center; padding:13px;">
                            Скасувати
                        </button>
                        <button type="submit" class="btn-primary" id="ord-submit-btn" style="flex:2; justify-content:center; padding:13px;">
                            Відправити
                        </button>
                    </div>
                </form>
            </div>

            <!-- SUCCESS STATE (hidden by default) -->
            <div id="ord-success-state" style="display:none; padding:60px 40px; text-align:center;">
                <!-- Animated checkmark circle -->
                <div style="width:100px; height:100px; margin:0 auto 32px; position:relative;">
                    <div style="width:100px; height:100px; border-radius:50%; background:rgba(52,199,89,0.1); border:4px solid #34c759; position:absolute; animation:successScaleIn 0.5s ease-out, successPulse 2s 0.5s ease-out infinite;"></div>
                    <i class="fas fa-check" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:3rem; color:#34c759; animation:successCheckPop 0.6s 0.4s ease-out backwards;"></i>
                </div>

                <h3 style="color:#fff; font-size:1.8rem; font-weight:700; margin:0 0 12px; animation:successFadeUp 0.5s 0.5s ease-out backwards;">Заявка прийнята!</h3>
                <p style="color:#6b7280; font-size:1rem; margin:0 0 28px; line-height:1.6; animation:successFadeUp 0.5s 0.6s ease-out backwards;">
                    Ми отримали вашу заявку і передзвонимо<br>протягом <span style="color:#007AFF; font-weight:600;">5 хвилин</span>
                </p>

                <div style="display:flex; flex-direction:column; gap:10px; animation:successFadeUp 0.5s 0.7s ease-out backwards;">
                    <button onclick="resetOrderForm()" class="btn-primary" style="width:100%; justify-content:center; padding:13px;">
                        Залишити ще заявку
                    </button>
                    <button onclick="closeOrderModal()" class="btn-outline" style="width:100%; justify-content:center; padding:13px;">
                        Закрити
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
function openOrderModal(serviceTitle) {
    var modal = document.getElementById('orderModal');
    var cnt   = document.getElementById('ordContainer');
    var ovl   = document.getElementById('ordOverlay');

    // Pre-fill device field
    if (serviceTitle) {
        var dev = document.querySelector('#ord-form [name="device"]');
        if (dev && !dev.value) dev.value = serviceTitle;
    }

    modal.style.display = 'block';
    lockScroll();
    cnt.scrollTop = 0;

    requestAnimationFrame(function(){ requestAnimationFrame(function(){
        ovl.style.background     = 'rgba(0,0,0,0.75)';
        ovl.style.backdropFilter = 'blur(8px)';
        cnt.style.opacity        = '1';
        cnt.style.transform      = 'scale(1) translateY(0)';
    }); });
}

function closeOrderModal() {
    var modal = document.getElementById('orderModal');
    var cnt   = document.getElementById('ordContainer');
    var ovl   = document.getElementById('ordOverlay');

    ovl.style.background     = 'rgba(0,0,0,0)';
    ovl.style.backdropFilter = 'blur(0px)';
    cnt.style.opacity        = '0';
    cnt.style.transform      = 'scale(.94) translateY(16px)';

    setTimeout(function(){
        modal.style.display = 'none';
        unlockScroll();
        // Reset to form state after close
        setTimeout(function(){
            document.getElementById('ord-form-state').style.display = 'block';
            document.getElementById('ord-success-state').style.display = 'none';
        }, 200);
    }, 340);
}

function resetOrderForm() {
    document.getElementById('ord-form').reset();
    document.getElementById('ord-form-state').style.display = 'block';
    document.getElementById('ord-success-state').style.display = 'none';
    document.getElementById('ord-submit-btn').disabled = false;
}

// Form submission
document.getElementById('ord-form').addEventListener('submit', function(e){
    e.preventDefault();
    var form = this;
    var btn  = document.getElementById('ord-submit-btn');
    var originalText = btn.innerHTML;

    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin" style="margin-right:8px;"></i>Надсилаємо...';
    btn.style.opacity = '0.6';

    var csrf = form.querySelector('[name=csrfmiddlewaretoken]').value;

    fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: { 'X-CSRFToken': csrf }
    })
    .then(function(response){
        if(response.ok || response.redirected){
            // Success - show success state
            document.getElementById('ord-form-state').style.display = 'none';
            document.getElementById('ord-success-state').style.display = 'block';
            form.reset();
        } else {
            throw new Error('Network error');
        }
    })
    .catch(function(err){
        alert('Помилка відправки. Спробуйте ще раз або зателефонуйте нам.');
        btn.disabled = false;
        btn.innerHTML = originalText;
        btn.style.opacity = '1';
    });
});

document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeOrderModal();
});
</script>
