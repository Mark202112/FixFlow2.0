{% extends 'dashboard/base_dashboard.html' %}
{% block title %}Календар — FixFlow{% endblock %}
{% block content %}

<div style="padding:32px;">
    <!-- Шапка -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:28px;">
        <div style="display:flex;align-items:center;gap:16px;">
            <button onclick="previousMonth()" style="width:40px;height:40px;background:#2a2a2d;border:1px solid #3a3a3c;border-radius:8px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;">
                <i class="fas fa-chevron-left"></i>
            </button>
            <h2 id="currentMonth" style="margin:0;font-size:1.5rem;font-weight:600;color:#fff;min-width:220px;text-align:center;"></h2>
            <button onclick="nextMonth()" style="width:40px;height:40px;background:#2a2a2d;border:1px solid #3a3a3c;border-radius:8px;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;">
                <i class="fas fa-chevron-right"></i>
            </button>
        </div>
        
        <!-- Легенда -->
        <div style="display:flex;gap:20px;align-items:center;">
            <div style="display:flex;align-items:center;gap:6px;">
                <div style="width:12px;height:12px;background:#ff3b30;border-radius:3px;"></div>
                <span style="color:#9ca3af;font-size:0.85rem;">Дедлайн</span>
            </div>
            <div style="display:flex;align-items:center;gap:6px;">
                <div style="width:12px;height:12px;background:#34c759;border-radius:3px;"></div>
                <span style="color:#9ca3af;font-size:0.85rem;">Готова</span>
            </div>
        </div>
    </div>

    <!-- Календар -->
    <div id="calendar" style="display:grid;grid-template-columns:repeat(7, 1fr);gap:12px;"></div>
</div>

<style>
.calendar-weekday {
    text-align:center;
    padding:12px;
    font-size:0.75rem;
    font-weight:600;
    color:#6b7280;
    text-transform:uppercase;
    letter-spacing:0.5px;
}

.calendar-day {
    background:#2a2a2d;
    border-radius:12px;
    padding:14px;
    min-height:140px;
    cursor:pointer;
    transition:all 0.2s;
    border:1px solid #3a3a3c;
    display:flex;
    flex-direction:column;
}

.calendar-day:hover {
    border-color:#34c759;
    transform:translateY(-2px);
}

.calendar-day.today {
    border-color:#34c759;
    box-shadow:0 0 0 2px rgba(52,199,89,0.2);
}

.calendar-day.other-month {
    opacity:0.3;
    cursor:default;
}

.calendar-day.other-month:hover {
    transform:none;
    border-color:#3a3a3c;
}

.day-number {
    font-size:1.1rem;
    font-weight:600;
    color:#fff;
    margin-bottom:10px;
}

.day-events {
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1;
}

/* За замовчуванням - червоний */
.event-item {
    background:rgba(255,59,48,0.15);
    border-left:3px solid #ff3b30;
    border-radius:6px;
    padding:6px 8px;
    font-size:0.75rem;
    color:#fff;
    display:flex;
    align-items:center;
    gap:6px;
    transition:all 0.2s;
}

.event-item:hover {
    background:rgba(255,59,48,0.25);
}

/* Якщо готова - зелений */
.event-item.ready {
    background:rgba(52,199,89,0.15);
    border-left-color:#34c759;
}

.event-item.ready:hover {
    background:rgba(52,199,89,0.25);
}

.event-time {
    font-size:0.7rem;
    color:#9ca3af;
    display:flex;
    align-items:center;
    gap:3px;
}

.event-title {
    flex:1;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.more-events {
    font-size:0.7rem;
    color:#ff3b30;
    margin-top:4px;
    cursor:pointer;
}
</style>

<script>
const events = {{ events_json|safe }};
const today = new Date('{{ today }}');
let currentYear = today.getFullYear();
let currentMonth = today.getMonth();

const monthNames = ["Січень","Лютий","Березень","Квітень","Травень","Червень","Липень","Серпень","Вересень","Жовтень","Листопад","Грудень"];
const dayNames = ["ПН","ВТ","СР","ЧТ","ПТ","СБ","НД"];

function renderCalendar() {
    const calendar = document.getElementById('calendar');
    calendar.innerHTML = '';
    
    dayNames.forEach(day => {
        const el = document.createElement('div');
        el.className = 'calendar-weekday';
        el.textContent = day;
        calendar.appendChild(el);
    });
    
    const firstDay = new Date(currentYear, currentMonth, 1);
    const lastDay = new Date(currentYear, currentMonth + 1, 0);
    const prevLastDay = new Date(currentYear, currentMonth, 0);
    
    const firstDayIndex = (firstDay.getDay() + 6) % 7;
    const lastDayDate = lastDay.getDate();
    const prevLastDayDate = prevLastDay.getDate();
    
    for (let i = firstDayIndex; i > 0; i--) {
        createDayElement(prevLastDayDate - i + 1, currentMonth - 1, true);
    }
    
    for (let day = 1; day <= lastDayDate; day++) {
        createDayElement(day, currentMonth, false);
    }
    
    const remainingDays = 42 - (firstDayIndex + lastDayDate);
    for (let day = 1; day <= remainingDays; day++) {
        createDayElement(day, currentMonth + 1, true);
    }
    
    document.getElementById('currentMonth').textContent = `${monthNames[currentMonth]} ${currentYear}`;
}

function createDayElement(day, month, isOtherMonth) {
    const dayEl = document.createElement('div');
    dayEl.className = 'calendar-day';
    if (isOtherMonth) dayEl.classList.add('other-month');
    
    const dateStr = formatDate(currentYear, month, day);
    const dayEvents = events.filter(e => e.date === dateStr);
    
    if (!isOtherMonth && day === today.getDate() && month === today.getMonth() && currentYear === today.getFullYear()) {
        dayEl.classList.add('today');
    }
    
    dayEl.innerHTML = `<div class="day-number">${day}</div><div class="day-events"></div>`;
    
    const eventsContainer = dayEl.querySelector('.day-events');
    
    if (dayEvents.length > 0) {
        const visibleEvents = dayEvents.slice(0, 3);
        
        visibleEvents.forEach(event => {
            const eventEl = document.createElement('div');
            eventEl.className = 'event-item';
            
            // Якщо статус "ready" - зелений
            if (event.status_code === 'ready') {
                eventEl.classList.add('ready');
            }
            // Інакше червоний (за замовчуванням)
            
            eventEl.innerHTML = `
                <div class="event-time">
                    <i class="fas fa-clock" style="font-size:0.65rem;"></i>
                    ${event.time || '—'}
                </div>
                <div class="event-title">${event.title}</div>
            `;
            
            eventEl.onclick = (e) => {
                e.stopPropagation();
                window.location.href = `/dashboard/orders/${event.id}/`;
            };
            
            eventsContainer.appendChild(eventEl);
        });
        
        if (dayEvents.length > 3) {
            const moreEl = document.createElement('div');
            moreEl.className = 'more-events';
            moreEl.textContent = `Ще ${dayEvents.length - 3}...`;
            eventsContainer.appendChild(moreEl);
        }
    }
    
    calendar.appendChild(dayEl);
}

function formatDate(year, month, day) {
    const m = month + 1;
    return `${year}-${m.toString().padStart(2, '0')}-${day.toString().padStart(2, '0')}`;
}

function previousMonth() {
    currentMonth--;
    if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
    }
    renderCalendar();
}

function nextMonth() {
    currentMonth++;
    if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
    }
    renderCalendar();
}

renderCalendar();
</script>

{% endblock %}
