{% extends 'base.html' %}
{% load static %}
{% block title %}Вхід — FixFlow{% endblock %}

{% block content %}
<div style="min-height:calc(100vh - 72px); display:flex; align-items:center; justify-content:center;
            padding:40px 16px;
            background-color:#F5F7FA;
            background-image:radial-gradient(rgba(0,122,255,0.05) 1px, transparent 1px);
            background-size:30px 30px;">

    <!-- Subtle glow blob -->
    <div style="position:fixed; top:30%; left:50%; transform:translate(-50%,-50%);
                width:600px; height:400px; border-radius:50%;
                background:rgba(0,122,255,0.06); filter:blur(100px);
                pointer-events:none; z-index:0;"></div>

    <div style="position:relative; z-index:1; width:100%; max-width:420px;">

        <!-- Logo -->
        <div style="text-align:center; margin-bottom:40px;">
            <a href="{% url 'main:home' %}" style="text-decoration:none; display:inline-flex; align-items:center; gap:16px; text-align:left;">
                <div style="width:52px; height:52px; border-radius:14px; display:flex; align-items:center; justify-content:center;
                             position:relative; overflow:hidden;
                             background:linear-gradient(135deg,#007AFF,#0056CC);
                             box-shadow:0 8px 24px rgba(0,122,255,0.3);">
                    <span style="color:#fff; font-size:1.8rem; font-weight:900; font-family:sans-serif; font-style:italic;">F</span>
                    <div style="position:absolute; bottom:0; right:0; width:18px; height:18px;
                                background:rgba(0,0,0,0.2); clip-path:polygon(100% 0, 0% 100%, 100% 100%);"></div>
                </div>
                <div>
                    <p style="color:#1A202C; font-size:1.4rem; font-weight:800; margin:0; line-height:1; letter-spacing:0.5px;">
                        FIX<span style="color:#007AFF;">FLOW</span>
                    </p>
                    <p style="color:#6b7280; font-size:.7rem; margin:0; line-height:1.4; margin-top:4px;
                               text-transform:uppercase; letter-spacing:.15em; font-weight:600;">Service Master</p>
                </div>
            </a>

            <p style="color:#6b7280; font-size:.8rem; margin-top:14px;
                       letter-spacing:.1em; text-transform:uppercase; font-weight:600;">
                Панель персоналу
            </p>
        </div>

        <!-- Card -->
        <div style="background:#FFFFFF; border:1px solid rgba(0,122,255,0.18);
                    border-radius:16px;
                    box-shadow:0 16px 48px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,122,255,0.06);
                    padding:40px; position:relative; overflow:hidden;">

            <!-- Top accent -->
            <div style="position:absolute;top:0;left:0;right:0;height:3px;
                        background:linear-gradient(90deg,transparent,#007AFF 40%,#007AFF 60%,transparent);"></div>

            <h1 style="color:#1A202C; font-size:1.5rem; font-weight:700; margin-bottom:6px; letter-spacing:-0.01em;">Вхід</h1>
            <p style="color:#6b7280; font-size:.875rem; margin-bottom:32px;">Введіть дані для доступу до системи</p>

            {% if error %}
            <div style="padding:12px 16px; margin-bottom:20px; border-radius:8px;
                        background:rgba(255,59,48,0.07); border:1px solid rgba(255,59,48,0.25);
                        display:flex; align-items:center; gap:10px; color:#dc2626; font-size:.875rem;">
                <i class="fas fa-exclamation-circle" style="flex-shrink:0;"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'dashboard:login' %}" id="login-form">
                {% csrf_token %}

                <!-- Username -->
                <div style="margin-bottom:18px;">
                    <label style="display:block; font-size:.65rem; font-weight:700; text-transform:uppercase;
                                  letter-spacing:.18em; color:#007AFF; margin-bottom:8px;">Логін</label>
                    <div style="position:relative;">
                        <i class="fas fa-user" style="position:absolute; left:14px; top:50%; transform:translateY(-50%);
                                                       color:#9ca3af; font-size:.8rem; pointer-events:none;"></i>
                        <input type="text" name="username" required autofocus
                               placeholder="Ім'я користувача"
                               style="width:100%; padding:13px 16px 13px 40px;
                                      background:#F7FAFC; border:1px solid #E2E8F0; border-radius:10px;
                                      color:#1A202C; font-size:.9rem; outline:none; box-sizing:border-box;
                                      transition:border-color .2s, box-shadow .2s;"
                               onfocus="this.style.borderColor='rgba(0,122,255,0.6)';this.style.boxShadow='0 0 0 3px rgba(0,122,255,0.1)';this.style.background='#fff'"
                               onblur="this.style.borderColor='#E2E8F0';this.style.boxShadow='none';this.style.background='#F7FAFC'">
                    </div>
                </div>

                <!-- Password -->
                <div style="margin-bottom:28px;">
                    <label style="display:block; font-size:.65rem; font-weight:700; text-transform:uppercase;
                                  letter-spacing:.18em; color:#007AFF; margin-bottom:8px;">Пароль</label>
                    <div style="position:relative;">
                        <i class="fas fa-lock" style="position:absolute; left:14px; top:50%; transform:translateY(-50%);
                                                       color:#9ca3af; font-size:.8rem; pointer-events:none;"></i>
                        <input type="password" name="password" required id="pass-input"
                               placeholder="••••••••"
                               style="width:100%; padding:13px 44px 13px 40px;
                                      background:#F7FAFC; border:1px solid #E2E8F0; border-radius:10px;
                                      color:#1A202C; font-size:.9rem; outline:none; box-sizing:border-box;
                                      transition:border-color .2s, box-shadow .2s;"
                               onfocus="this.style.borderColor='rgba(0,122,255,0.6)';this.style.boxShadow='0 0 0 3px rgba(0,122,255,0.1)';this.style.background='#fff'"
                               onblur="this.style.borderColor='#E2E8F0';this.style.boxShadow='none';this.style.background='#F7FAFC'">
                        <!-- Eye toggle -->
                        <button type="button" onclick="togglePass()"
                                style="position:absolute; right:14px; top:50%; transform:translateY(-50%);
                                       background:none; border:none; color:#9ca3af; cursor:pointer; padding:0;
                                       transition:color .2s; font-size:.8rem;"
                                onmouseover="this.style.color='#6b7280'"
                                onmouseout="this.style.color='#9ca3af'">
                            <i class="fas fa-eye" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary" style="width:100%; padding:14px;">
                    <i class="fas fa-sign-in-alt" style="margin-right:8px; font-size:.85rem;"></i>
                    Увійти
                </button>
            </form>

            <div style="margin-top:24px; padding-top:20px; border-top:1px solid #E2E8F0; text-align:center;">
                <a href="{% url 'main:home' %}"
                   style="color:#9ca3af; font-size:.8rem; text-decoration:none; transition:color .2s;"
                   onmouseover="this.style.color='#007AFF'"
                   onmouseout="this.style.color='#9ca3af'">
                    <i class="fas fa-arrow-left" style="margin-right:6px; font-size:.7rem;"></i>
                    Повернутись на головну
                </a>
            </div>
        </div>

    </div>
</div>

<script>
function togglePass() {
    var inp = document.getElementById('pass-input');
    var ico = document.getElementById('eye-icon');
    if (inp.type === 'password') {
        inp.type = 'text';
        ico.className = 'fas fa-eye-slash';
    } else {
        inp.type = 'password';
        ico.className = 'fas fa-eye';
    }
}
</script>
{% endblock %}
